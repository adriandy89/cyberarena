# Lab: auth-bypass — NEW room auth-bypass (WebApp Pentesting)
# Three authentication levels, each bypassable via different technique.
name: lab-auth-bypass

x-cyberarena:
  access: http

services:
  web:
    image: python:3.12-alpine
    working_dir: /app
    volumes:
      - ./site:/site:ro
    command: sh -c "cp /site/app.py /app/app.py && python /app/app.py"
    environment:
      FLAG_1: ${FLAG_1:?set FLAG_1}
      FLAG_2: ${FLAG_2:?set FLAG_2}
      FLAG_3: ${FLAG_3:?set FLAG_3}
    ports:
      - '127.0.0.1:18086:8080'
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID]
    security_opt: [no-new-privileges:true]
    restart: "no"
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 128
    networks: [lab]

networks:
  lab:
    name: lab-auth-bypass
