name: lab-phishing

x-cyberarena:
  access: http
services:
  web:
    image: python:3.12-alpine
    volumes: [./site:/site:ro]
    command: sh -c "cp /site/app.py /app.py && python /app.py"
    environment: {FLAG_1: "${FLAG_1:?}", FLAG_2: "${FLAG_2:?}", FLAG_3: "${FLAG_3:?}", FLAG_4: "${FLAG_4:?}"}
    ports: ['127.0.0.1:18106:8080']
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID]
    security_opt: [no-new-privileges:true]
    restart: "no"
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 128
    networks: [lab]
networks: {lab: {name: lab-phishing}}
