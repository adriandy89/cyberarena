# Lab: nmap-playground — rooms recon-activo-escaneo + nmap-pro
# Multi-port TCP server with realistic service banners.
# All ports mapped to 28xxx range on host to avoid conflicts.
name: lab-nmap-playground

services:
  web:
    image: python:3.12-alpine
    working_dir: /app
    volumes:
      - ./site:/site:ro
    command: sh -c "cp /site/server.py /app/server.py && python /app/server.py"
    environment:
      FLAG_1: ${FLAG_1:?set FLAG_1}
      FLAG_2: ${FLAG_2:?set FLAG_2}
      FLAG_3: ${FLAG_3:?set FLAG_3}
      FLAG_4: ${FLAG_4:?set FLAG_4}
    ports:
      - '127.0.0.1:28021:8021'   # FTP
      - '127.0.0.1:28022:8022'   # SSH
      - '127.0.0.1:28080:8080'   # HTTP
      - '127.0.0.1:28443:8443'   # HTTPS
      - '127.0.0.1:28306:3306'   # MySQL
      - '127.0.0.1:28379:6379'   # Redis
      - '127.0.0.1:28901:9001'   # Supervisor
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID, NET_BIND_SERVICE, DAC_OVERRIDE, FOWNER]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    networks: [lab]

networks:
  lab:
    name: lab-nmap-playground
