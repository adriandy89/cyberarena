# Lab: sqli-basico — room sqli-basico (Web App Pentesting)
# A REAL SQL injection vulnerable app using Python stdlib only.
# Up:    docker compose -f labs/sqli-basico/compose.yaml --env-file labs/sqli-basico/flags.env up -d
# Down:  docker compose -f labs/sqli-basico/compose.yaml --env-file labs/sqli-basico/flags.env down -v
name: lab-sqli-basico

services:
  web:
    image: python:3.12-alpine
    working_dir: /app
    volumes:
      - ./site:/site:ro
    command: >
      sh -c "cp /site/app.py /app/app.py && python /app/app.py"
    environment:
      FLAG_1: ${FLAG_1:?set FLAG_1 in labs/sqli-basico/flags.env}
      FLAG_2: ${FLAG_2:?set FLAG_2 in labs/sqli-basico/flags.env}
    ports:
      - '127.0.0.1:18081:8080'
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    networks: [lab]

networks:
  lab:
    name: lab-sqli-basico
