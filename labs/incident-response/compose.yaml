# Lab: incident-response — room defensa-introduccion (task adicional)
# A compromised Alpine host: cron backdoor, hidden UID-0 user, disguised
# process, live C2 session. Investigate via docker exec.
# Up:    docker compose -f labs/incident-response/compose.yaml --env-file labs/incident-response/flags.env up -d
# Enter: docker exec -it lab-incident-response-victim-1 sh
# Down:  docker compose -f labs/incident-response/compose.yaml --env-file labs/incident-response/flags.env down -v
name: lab-incident-response
services:
  victim:
    image: alpine:3.20
    entrypoint: ["/bin/sh", "/setup.sh"]
    volumes: [./setup.sh:/setup.sh:ro]
    environment:
      FLAG_1: ${FLAG_1:?set FLAG_1}
      FLAG_2: ${FLAG_2:?set FLAG_2}
      FLAG_3: ${FLAG_3:?set FLAG_3}
      FLAG_4: ${FLAG_4:?set FLAG_4}
    stdin_open: true
    tty: true
    cap_add: [CHOWN, SETUID, SETGID, DAC_OVERRIDE, FOWNER]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    networks: [lab]
  c2-server:
    image: python:3.12-alpine
    volumes: [./c2-server.py:/c2.py:ro]
    command: python /c2.py
    environment: {FLAG_4: "${FLAG_4:?}"}
    ports: ['127.0.0.1:18108:4444']
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    networks: [lab]
networks: {lab: {name: lab-incident-response}}
