# Lab: linux-explore — rooms linux-fundamentos-1/2 (CS101)
# A real Linux filesystem to explore: files to find, permissions, /etc/passwd, processes.
# Interactive: docker exec. Pattern C.
name: lab-linux-explore

x-cyberarena:
  access: exec

services:
  shell:
    image: alpine:3.20
    entrypoint: ["/bin/sh", "/setup.sh"]
    volumes:
      - ./setup.sh:/setup.sh:ro
    environment:
      FLAG_1: ${FLAG_1:?set FLAG_1}
      FLAG_2: ${FLAG_2:?set FLAG_2}
      FLAG_3: ${FLAG_3:?set FLAG_3}
      FLAG_4: ${FLAG_4:?set FLAG_4}
    stdin_open: true
    tty: true
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID, DAC_OVERRIDE, FOWNER]
    security_opt: [no-new-privileges:true]
    restart: "no"
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 128
    networks: [lab]

networks:
  lab:
    name: lab-linux-explore
