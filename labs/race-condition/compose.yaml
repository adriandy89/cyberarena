# Lab: race-condition — TOCTOU, double-spend, limit bypass
# Up:    docker compose -f labs/race-condition/compose.yaml --env-file labs/race-condition/flags.env up -d
# Down:  docker compose -f labs/race-condition/compose.yaml --env-file labs/race-condition/flags.env down -v
name: lab-race-condition

services:
  web:
    image: python:3.12-alpine
    working_dir: /app
    volumes:
      - ./site:/site:ro
    command: sh -c "cp /site/app.py /app/app.py && python /app/app.py"
    environment:
      FLAG_1: ${FLAG_1:?set FLAG_1}
      FLAG_2: ${FLAG_2:?set FLAG_2}
      FLAG_3: ${FLAG_3:?set FLAG_3}
    ports:
      - '127.0.0.1:18099:8080'
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    networks: [lab]

networks:
  lab:
    name: lab-race-condition
