name: lab-reverse-engineering

x-cyberarena:
  access: http
services:
  web:
    image: python:3.12-alpine
    volumes:
      - ./site:/site:ro
      - bins:/bins
    command: >
      sh -c "cp /site/generate_bins.py /gen.py && python /gen.py &&
             cd /bins && python -m http.server 8080 --bind 0.0.0.0"
    environment: {FLAG_1: "${FLAG_1:?}", FLAG_2: "${FLAG_2:?}", FLAG_3: "${FLAG_3:?}"}
    ports: ['127.0.0.1:18111:8080']
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID]
    security_opt: [no-new-privileges:true]
    restart: "no"
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 128
    networks: [lab]
networks: {lab: {name: lab-reverse-engineering}}
volumes: {bins: {}}
