# Lab: dns-enumerate — additional task in room recon-pasivo-osint
# DNS-style enumeration: zone transfer simulation + subdomain discovery.
name: lab-dns-enumerate

services:
  web:
    image: python:3.12-alpine
    working_dir: /app
    volumes:
      - ./site:/site:ro
    command: sh -c "cp /site/app.py /app/app.py && python /app/app.py"
    environment:
      FLAG_1: ${FLAG_1:?set FLAG_1}
      FLAG_2: ${FLAG_2:?set FLAG_2}
    ports:
      - '127.0.0.1:18098:8080'
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    networks: [lab]

networks:
  lab:
    name: lab-dns-enumerate
