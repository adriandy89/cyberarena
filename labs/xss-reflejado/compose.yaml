# Lab: xss-reflejado — room xss-reflejado (WebApp Pentesting)
# Reflected + Stored XSS vulnerable app. Python stdlib only.
# Up:    docker compose -f labs/xss-reflejado/compose.yaml --env-file labs/xss-reflejado/flags.env up -d
# Down:  docker compose -f labs/xss-reflejado/compose.yaml --env-file labs/xss-reflejado/flags.env down -v
name: lab-xss-reflejado

x-cyberarena:
  access: http

services:
  web:
    image: python:3.12-alpine
    working_dir: /app
    volumes:
      - ./site:/site:ro
    command: sh -c "cp /site/app.py /app/app.py && python /app/app.py"
    environment:
      FLAG_1: ${FLAG_1:?set FLAG_1 in labs/xss-reflejado/flags.env}
      FLAG_2: ${FLAG_2:?set FLAG_2 in labs/xss-reflejado/flags.env}
    ports:
      - '127.0.0.1:18082:8080'
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID]
    security_opt: [no-new-privileges:true]
    restart: "no"
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 128
    networks: [lab]

networks:
  lab:
    name: lab-xss-reflejado
