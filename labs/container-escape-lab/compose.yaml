# Lab: container-escape-lab — room containers-y-cloud (task adicional)
# A container WITH a mounted docker.sock — except the daemon on the other
# end is simulated (fake-dockerd): real curl --unix-socket technique,
# zero risk to the host. Learn to spot and exploit the exposure.
# Enter: docker exec -it lab-container-escape-shell-1 sh
name: lab-container-escape

x-cyberarena:
  access: exec
services:
  shell:
    image: alpine:3.20
    entrypoint: ["/bin/sh", "/setup.sh"]
    volumes:
      - ./setup.sh:/setup.sh:ro
      - ./fake-dockerd.py:/fake-dockerd.py:ro
      # THE misconfiguration under study (simulated on the other end):
      - docker-sock-dir:/var/run
    environment:
      FLAG_1: ${FLAG_1:?set FLAG_1}
      FLAG_2: ${FLAG_2:?set FLAG_2}
      FLAG_3: ${FLAG_3:?set FLAG_3}
    stdin_open: true
    tty: true
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID, DAC_OVERRIDE]
    security_opt: [no-new-privileges:true]
    restart: "no"
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 128
    networks: [lab]
networks: {lab: {name: lab-container-escape}}
# named volume so the socket file is writable inside the container
volumes: {docker-sock-dir: {}}
