packages:
  - "apps/*"
  - "packages/*"

# pnpm settings (read by both host and dev containers).

# Native build scripts explicitly allowed to run (pnpm 11 allowBuilds).
allowBuilds:
  '@parcel/watcher': true
  '@prisma/engines': true
  '@swc/core': true
  esbuild: true
  prisma: true
  unrs-resolver: true
  sharp: true

# In dev containers, node_modules starts as an empty anonymous volume; pnpm
# would prompt to purge the "unexpected" modules dir. Allow it silently.
confirmModulesPurge: false

minimumReleaseAgeExclude:
  - '@better-auth/core@1.7.15'
  - '@better-auth/drizzle-adapter@1.7.15'
  - '@better-auth/kysely-adapter@1.7.15'
  - '@better-auth/memory-adapter@1.7.15'
  - '@better-auth/mongo-adapter@1.7.15'
  - '@better-auth/prisma-adapter@1.7.15'
  - '@better-auth/telemetry@1.7.15'
  - better-auth@1.7.15
