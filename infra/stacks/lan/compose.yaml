# CyberArena — LAN deployment overlay (phase 013).
#
# Used ON TOP of infra/stacks/prod/compose.yaml, from a stack folder that lives
# OUTSIDE the git clone (so `git pull` never meets local changes):
#
#   ~/cyberarena/repo    git clone (untouched)
#   ~/cyberarena/stack   .env, secrets/, lab-flags/, backups/, cyberarena.sh -> repo
#
# Run it through cyberarena.sh (see README.md). ONE compose project with its own
# networks and no reverse proxy: the web is published on WEB_PORT over plain
# HTTP for the LAN, and proxies /api to the api inside the project network.
services:
  api:
    build:
      context: ${REPO_DIR:?set REPO_DIR in the stack .env}
  web:
    build:
      context: ${REPO_DIR}
    ports:
      # The only port the platform publishes (labs publish theirs while running).
      - '${WEB_PORT:-3080}:3000'
  lab-runner:
    build:
      context: ${REPO_DIR}

networks:
  # The prod file joins api and web to an external proxy network (Caddy). Here
  # there is no proxy: the network is the project's own and goes away with it.
  proxy:
    name: cyberarena-lan-net
    external: false
