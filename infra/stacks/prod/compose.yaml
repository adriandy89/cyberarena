# CyberArena — PRODUCTION stack (phase 008).
# Build & run from the repository root:
#   docker compose --project-directory infra/stacks/prod -f infra/stacks/prod/compose.yaml --env-file infra/stacks/prod/.env up -d --build
# (build contexts below are relative to infra/stacks/prod, so they reach the repo root)
# The reverse proxy lives in infra/stacks/proxy (bring it up FIRST).
name: cyberarena-prod

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cyberarena}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_DB: ${POSTGRES_DB:-cyberarena}
    secrets:
      - postgres_password
    ports:
      # Ops access only (backups/psql), loopback only: never public, and labs
      # cannot reach it through their bridge gateway (constitution §1.4).
      - '127.0.0.1:${POSTGRES_PORT:-5433}:5432'
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID, DAC_OVERRIDE, FOWNER]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    networks: [backend]

  api:
    build:
      # Paths resolve from the project directory (infra/stacks/prod).
      context: ../../..
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: production
      # Entrypoint builds DATABASE_URL from these + the postgres_password secret.
      DB_USER: ${POSTGRES_USER:-cyberarena}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-cyberarena}
      API_PORT: 3001
      CORS_ORIGINS: ${WEB_ORIGIN:-https://localhost}
      WEB_URL: ${WEB_ORIGIN:-https://localhost}
      # better-auth: links/origin through the public origin (proxy + rewrite).
      BETTER_AUTH_URL: ${WEB_ORIGIN:-https://localhost}
      REQUIRE_EMAIL_VERIFICATION: ${REQUIRE_EMAIL_VERIFICATION:-false}
      EMAIL_FROM: ${EMAIL_FROM:-CyberArena <no-reply@cyberarena.local>}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-admin@cyberarena.local}
      # Real password travels via secrets/bootstrap_admin_password (optional:
      # without it, a random one is generated and logged once — ADR-009).
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      MIGRATE_ON_BOOT: 'true'
      # Labs on demand (phase 011): the API leases labs, the runner starts them.
      LABS_ENABLED: ${LABS_ENABLED:-true}
      LAB_RUNNER_URL: http://lab-runner:4100
      LAB_RUNNER_TOKEN_FILE: /run/secrets/lab_runner_token
      LAB_MAX_RUNNING: ${LAB_MAX_RUNNING:-3}
    secrets:
      - postgres_password
      - better_auth_secret
      - bootstrap_admin_password
      - lab_runner_token
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - node -e "fetch('http://127.0.0.1:3001/api/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
    restart: unless-stopped
    networks:
      - frontend
      - backend
      - proxy
      - labs-control

  # The only service with Docker access (ADR-015): starts/stops labs for the
  # API and stops by itself any lab whose deadline the API stops renewing.
  lab-runner:
    build:
      context: ../../..
      dockerfile: apps/lab-runner/Dockerfile
    environment:
      LAB_RUNNER_TOKEN_FILE: /run/secrets/lab_runner_token
      LAB_FLAGS_DIR: /run/lab-flags
      LAB_ASSETS: volume
      LAB_ASSETS_VOLUME: cyberarena-lab-assets
      LAB_ASSETS_MOUNT: /assets
      LAB_MAX_RUNNING: ${LAB_MAX_RUNNING:-3}
    secrets:
      - lab_runner_token
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Generated by infra/scripts/lab-flags.sh (gitignored).
      - ./lab-flags:/run/lab-flags:ro
      - lab-assets:/assets
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 128
    # A crash re-adopts running labs; a deliberate stop (SIGTERM) stops them all.
    restart: always
    stop_grace_period: 60s
    networks: [labs-control]

  web:
    build:
      context: ../../..
      dockerfile: apps/web/Dockerfile
    environment:
      NODE_ENV: production
      # Next standalone binds to $HOSTNAME; the container's hostname would bind
      # only that interface — force all interfaces so Caddy can reach it.
      HOSTNAME: 0.0.0.0
      # Server-side API URL: internal docker network (browser goes through the
      # same-origin /api rewrite — ADR-008).
      API_URL: http://api:3001
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on:
      api:
        condition: service_started
    healthcheck:
      test:
        - CMD-SHELL
        - node -e "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - frontend
      - proxy

volumes:
  pgdata:
  # Lab files served to lab containers by subpath (fixed name: labs mount it).
  lab-assets:
    name: cyberarena-lab-assets

secrets:
  postgres_password:
    file: secrets/postgres_password
  better_auth_secret:
    file: secrets/better_auth_secret
  bootstrap_admin_password:
    file: secrets/bootstrap_admin_password
  lab_runner_token:
    file: secrets/lab_runner_token

networks:
  # web <-> api (and api egress: SMTP, etc.)
  frontend:
    name: cyberarena-prod-frontend
  # api <-> postgres. Internal: no egress at all (blast radius).
  backend:
    name: cyberarena-prod-backend
    internal: true
  # Shared with infra/stacks/proxy (Caddy). Bring the proxy stack up FIRST.
  proxy:
    name: cyberarena_proxy
    external: true
  # api <-> lab-runner only. Internal: the runner is unreachable from anywhere else.
  labs-control:
    name: cyberarena-prod-labs-control
    internal: true
