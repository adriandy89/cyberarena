# CyberArena — development stack (phase 000).
# Run from the repository root:
#   docker compose --project-directory . -f infra/stacks/dev/compose.yaml --env-file infra/stacks/dev/.env up -d
# Only infrastructure (postgres + mailpit):
#   docker compose --project-directory . -f infra/stacks/dev/compose.yaml --env-file infra/stacks/dev/.env up -d postgres mailpit
# Labs on demand (phase 011): add `--profile labs` (needs LAB_RUNNER_TOKEN and
# infra/scripts/lab-flags.sh infra/stacks/dev/lab-flags).
name: cyberarena-dev

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cyberarena}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in infra/stacks/dev/.env}
      POSTGRES_DB: ${POSTGRES_DB:-cyberarena}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      # Postgres 18+: mount the parent dir; data lands in a per-version subdir
      # (required layout for future pg_upgrade --link, see docker-library/postgres#37).
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    cap_drop:
      - ALL
    # Minimal set required by the official image entrypoint (chown + su to postgres).
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
      - FOWNER
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    networks:
      - backend

  mailpit:
    # Dev SMTP catch-all (UI :8025, SMTP :1025). Used by auth emails from phase 001.
    image: axllent/mailpit:latest
    ports:
      - '${MAILPIT_UI_PORT:-8025}:8025'
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    networks:
      - backend

  api:
    image: node:22-bookworm-slim
    working_dir: /app
    command: sh -c "corepack enable pnpm && pnpm install --prefer-offline && pnpm --filter @repo/api dev"
    init: true
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://${POSTGRES_USER:-cyberarena}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-cyberarena}
      API_PORT: ${API_PORT:-3001}
      API_HOST: 0.0.0.0
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      # Better Auth: links/origin use the web origin (the /api rewrite forwards
      # to the api), dev secret overridable from the stack .env.
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-dev-only-secret-change-me-at-least-32-chars}
      REQUIRE_EMAIL_VERIFICATION: ${REQUIRE_EMAIL_VERIFICATION:-false}
      # Initial admin bootstrap: only runs on first boot with an empty DB (ADR-009).
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-admin@cyberarena.local}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      # Mailpit (dev SMTP) inside the backend network.
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      EMAIL_FROM: ${EMAIL_FROM:-CyberArena <no-reply@cyberarena.local>}
      # Labs on demand (phase 011): off unless the `labs` profile runs the runner.
      LABS_ENABLED: ${LABS_ENABLED:-false}
      LAB_RUNNER_URL: http://lab-runner:4100
      LAB_RUNNER_TOKEN: ${LAB_RUNNER_TOKEN:-}
      # Tunable in dev to watch the reaper work (defaults are the agreed policy).
      LAB_IDLE_TIMEOUT_MIN: ${LAB_IDLE_TIMEOUT_MIN:-10}
      LAB_SWEEP_SECONDS: ${LAB_SWEEP_SECONDS:-60}
    ports:
      - '${API_PORT:-3001}:3001'
    volumes:
      # Whole monorepo bind-mounted for hot reload (paths resolve from the
      # project directory, i.e. the repo root); node_modules shadows keep
      # container-native binaries (Windows host cannot share them).
      - .:/app
      - /app/node_modules
      - /app/apps/api/node_modules
      - /app/apps/web/node_modules
      - /app/packages/config/node_modules
      - /app/packages/shared/node_modules
      - /app/packages/database/node_modules
      - /app/packages/content/node_modules
      - /app/packages/ui/node_modules
      - /app/apps/lab-runner/node_modules
      - pnpm-store:/pnpm/store
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - node -e "fetch('http://127.0.0.1:3001/api/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    networks:
      - frontend
      - backend
      - labs-control

  # Labs on demand (phase 011, ADR-015). Same image as production; the port is
  # published on loopback for an API running on the host (`pnpm dev`).
  lab-runner:
    profiles: [labs]
    build:
      context: .
      dockerfile: apps/lab-runner/Dockerfile
    environment:
      LAB_RUNNER_TOKEN: ${LAB_RUNNER_TOKEN:-}
      LAB_FLAGS_DIR: /run/lab-flags
      LAB_ASSETS: volume
      LAB_ASSETS_VOLUME: cyberarena-lab-assets
      LAB_ASSETS_MOUNT: /assets
      LAB_MAX_RUNNING: ${LAB_MAX_RUNNING:-3}
      # Tunable in dev to test deadlines quickly.
      LAB_UNLEASED_GRACE_SECONDS: ${LAB_UNLEASED_GRACE_SECONDS:-300}
      LAB_LOOP_SECONDS: ${LAB_LOOP_SECONDS:-30}
    ports:
      - '127.0.0.1:${LAB_RUNNER_PORT:-4100}:4100'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./infra/stacks/dev/lab-flags:/run/lab-flags:ro
      - lab-assets:/assets
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 128
    # Dev: a manual stop sticks (prod uses `always`). Only ONE lab-runner per
    # Docker host: two runners would adopt and stop each other's labs.
    restart: unless-stopped
    stop_grace_period: 60s
    networks:
      - labs-control

  web:
    image: node:22-bookworm-slim
    working_dir: /app
    command: sh -c "corepack enable pnpm && pnpm install --prefer-offline && pnpm --filter @repo/web dev"
    init: true
    environment:
      NODE_ENV: development
      # Server-side URL of the API for the Next rewrite proxy (/api -> api).
      API_URL: http://api:3001
      # Browser-facing API URL is NOT needed anymore: requests go through the
      # same-origin rewrite (ADR-008).
      CHOKIDAR_USEPOLLING: 'true'
      WATCHPACK_POLLING: 'true'
    ports:
      - '${WEB_PORT:-3000}:3000'
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/api/node_modules
      - /app/apps/web/node_modules
      - /app/packages/config/node_modules
      - /app/packages/shared/node_modules
      - /app/packages/database/node_modules
      - /app/packages/content/node_modules
      - /app/packages/ui/node_modules
      - /app/apps/lab-runner/node_modules
      - pnpm-store:/pnpm/store
    depends_on:
      api:
        condition: service_started
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    networks:
      - frontend

volumes:
  pgdata:
  pnpm-store:
  lab-assets:
    name: cyberarena-lab-assets

networks:
  # web <-> api
  frontend: {}
  # api <-> postgres, mailpit (web cannot reach the database)
  backend: {}
  # api <-> lab-runner. Not internal in dev only: the runner publishes its port
  # on loopback for an API running on the host.
  labs-control: {}
