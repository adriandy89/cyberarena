# CyberArena — reverse proxy stack (bring up BEFORE the prod stack).
# From the repository root (paths below resolve from infra/stacks/proxy):
#   docker compose --project-directory infra/stacks/proxy -f infra/stacks/proxy/compose.yaml --env-file infra/stacks/proxy/.env up -d
name: cyberarena-proxy

services:
  caddy:
    image: caddy:2.10-alpine
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp' # HTTP/3
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE, CHOWN, SETUID, SETGID, DAC_OVERRIDE]
    security_opt: [no-new-privileges:true]
    # Caddy's admin API answers on loopback inside the container.
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1:2019/config/']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks: [proxy]

volumes:
  caddy_data:
  caddy_config:

networks:
  # Shared with the prod stack (web joins as external).
  proxy:
    name: cyberarena_proxy
